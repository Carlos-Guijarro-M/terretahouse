<div class="reservas">

  <!-- Sección Hero de cabecera -->
  <section class="hero">
    <h1>Mis Reservas</h1>
  </section>

  <!-- Contenedor principal -->
  <section class="section">
    <h2>Reservas Activas</h2>

    @if (!reservas || reservas.length === 0) {
      <div class="no-reservas">
        📭 No tienes reservas todavía. ¡Anímate a descubrir la Terreta!
      </div>
    } @else {
      
      <!-- CONTENEDOR GRID: Esto hace la magia de ponerlas juntas -->
      <div class="grid">
        
        @for (r of reservas; track r.id) {
          <div class="card">
            <h3>🎯 {{ r.titulo }}</h3>
            <p class="fecha">📅 <strong>Fecha:</strong> {{ r.fecha }}</p>
            <p class="estado">
              ⚙️ <strong>Estado:</strong> 
              <span class="badge">{{ r.estado || 'pendiente' }}</span>
            </p>
            <button class="btn-eliminar">❌ Cancelar Reserva</button>
          </div>
        }

      </div>

    }

  </section>

</div>
