<header class="header">

    <div class="logo">
        <img src="/logo.svg" alt="TerretaHouse">
    </div>

    <div class="menu-toggle">
        ☰
    </div>

    <nav class="nav">
        <a routerLink="/">Inicio</a>
        <a routerLink="/guias">Guías de Turismo</a>
        <a routerLink="/ofertas">Ofertas</a>
        <a routerLink="/contacto">Contacto</a>
    </nav>

    <!-- Usamos el Signal del servicio directamente -->
    @if (!auth.currentUser()) {

    <div class="autentificacion">
        <a routerLink="/login">Iniciar Sesión</a>
        <a routerLink="/register">Registrarme</a>
    </div>

    } @else {

    <div class="autentificacion">
        <!-- Obtenemos el email desde el objeto que devuelve el Signal -->
        <span>
            Hola, {{ auth.currentUser().email }}
        </span>

        @if (auth.currentUser()?.roles?.includes('ROLE_ADMIN')) {
        <span class="style-admin">
            ADMIN
        </span>
        }
        <a (click)="logout()" style="cursor: pointer; margin-left: 10px;">
            Salir
        </a>
    </div>

    }

</header>
