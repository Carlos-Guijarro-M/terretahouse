<div class="register-container">

  <div class="register-card">

    <h2>Crear cuenta</h2>

    <form class="register-form" (ngSubmit)="register()">

      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" placeholder="Email">

      <label>Contraseña</label>
      <input type="password" [(ngModel)]="password" name="password" placeholder="Contraseña">

      <label>Confirmar contraseña</label>
      <input type="password" [(ngModel)]="confirmarPassword" name="confirmarPassword" placeholder="Repetir contraseña">

      @if (error) {
      <p style="color: red;">{{ error }}</p>
      }

      <button type="submit">Registrarme</button>

      <p class="register-link">
        ¿Ya tienes cuenta?
        <a routerLink="/login">Inicia sesión</a>
      </p>

    </form>

  </div>

</div>
